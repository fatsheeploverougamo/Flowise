dialog:
    title: 'Cube Properties Dialog'
    width: 600
    height: 800
widget:
    type: QWidget
    layout: QVBoxLayout
    children:
        - type: CollapsiblePanel
          title: 'Transform'
          children:
              - type: QFormLayout
                children:
                    - label: 'Location X'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' m', minimum: -1000, maximum: 1000 }
                    - label: 'Location Y'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' m', minimum: -1000, maximum: 1000 }
                    - label: 'Location Z'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' m', minimum: -1000, maximum: 1000 }
                    - label: 'Rotation Z'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' °', maximum: 360 }

        - type: CollapsiblePanel
          title: 'Relations'
          children:
              - type: QFormLayout
                children:
                    - label: 'Parent'
                      widget: QLineEdit
                    - label: 'Type'
                      widget: QComboBox
                      items: ['Object', 'Armature', 'Constraint']
                    - label: 'Child'
                      widget: QLineEdit

        - type: CollapsiblePanel
          title: 'Visibility'
          children:
              - type: QFormLayout
                children:
                    - label: 'Visible'
                      widget: QCheckBox
                    - label: 'Opacity'
                      widget: QDoubleSpinBox
                      properties: { minimum: 0, maximum: 1, singleStep: 0.1 }
                    - label: 'Renderable'
                      widget: QCheckBox

        - type: CollapsiblePanel
          title: 'Motion Paths'
          children:
              - type: QFormLayout
                children:
                    - label: 'Path Start'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' s', minimum: 0, maximum: 100 }
                    - label: 'Path End'
                      widget: QDoubleSpinBox
                      properties: { suffix: ' s', minimum: 0, maximum: 100 }
                    - label: 'Loop'
                      widget: QCheckBox

        - type: CollapsiblePanel
          title: 'Instancing'
          children:
              - type: QFormLayout
                children:
                    - label: 'Enable Instancing'
                      widget: QCheckBox
                    - label: 'Instance Count'
                      widget: QSpinBox
                      properties: { minimum: 1, maximum: 1000 }

        - type: CollapsiblePanel
          title: 'Viewport Display'
          children:
              - type: QFormLayout
                children:
                    - label: 'Display Mode'
                      widget: QComboBox
                      items: ['Wireframe', 'Solid', 'Rendered']
                    - label: 'Color'
                      widget: QLineEdit
                      properties: { placeholder: 'e.g., #FF0000' }

        - type: CollapsiblePanel
          title: 'Line Art'
          children:
              - type: QFormLayout
                children:
                    - label: 'Enable Line Art'
                      widget: QCheckBox
                    - label: 'Thickness'
                      widget: QDoubleSpinBox
                      properties: { minimum: 0.1, maximum: 10, singleStep: 0.1 }

        - type: CollapsiblePanel
          title: 'Custom Properties'
          children:
              - type: QFormLayout
                children:
                    - label: 'Property Name'
                      widget: QLineEdit
                    - label: 'Value'
                      widget: QLineEdit
                    - label: ''
                      widget: QPushButton
                      text: 'Save'
                      on_click: 'save_clicked'

        - type: CollapsiblePanel
          title: 'Additional Settings'
          children:
              - type: QFormLayout
                children:
                    - label: 'Feature Options'
                      widget: QGroupBox
                      layout: QVBoxLayout
                      children:
                          - type: QCheckBox
                            text: 'Enable Shadows'
                          - type: QCheckBox
                            text: 'Enable Reflections'
                          - type: QCheckBox
                            text: 'Enable Anti-Aliasing'
                    - label: 'Render Quality'
                      widget: QGroupBox
                      layout: QVBoxLayout
                      children:
                          - type: QRadioButton
                            text: 'Low Quality'
                            properties: { checked: true }
                          - type: QRadioButton
                            text: 'Medium Quality'
                          - type: QRadioButton
                            text: 'High Quality'
                    - label: 'Texture File'
                      widget: QWidget
                      layout: QHBoxLayout
                      children:
                          - type: QLineEdit
                            properties: { placeholder: 'Select a texture file' }
                          - type: QPushButton
                            text: 'Browse'
                            on_click: 'open_file_dialog'

        - type: CollapsiblePanel
          title: 'Data Table'
          children:
              - type: QFormLayout
                children:
                    - label: 'Data Input'
                      widget: QTableWidget
                      properties:
                          rowCount: 5
                          columnCount: 3
                          headers: ['Name', 'Value', 'Type']
